name: SIMKL rewatch cleanup

# Inventory (and optionally delete) extra rewatch sessions on SIMKL Pro/VIP.
# Your original / oldest watch is never targeted — only is_rewatch=true sessions.

on:
  workflow_dispatch:
    inputs:
      media_type:
        description: >
          Which SIMKL library to scan for extra rewatch sessions.
          Use "all" unless you only want one category.
        required: true
        default: all — anime + TV shows + movies (recommended)
        type: choice
        options:
          - all — anime + TV shows + movies (recommended)
          - anime only
          - TV shows only
          - movies only
      mode:
        description: >
          Safe preview vs real deletion.
          "List only" never changes SIMKL (recommended first run).
          "Delete rewatch sessions" calls the API to remove extras.
        required: true
        default: List only (safe preview — no changes)
        type: choice
        options:
          - List only (safe preview — no changes)
          - Delete rewatch sessions (writes to SIMKL)
      max_deletes:
        description: >
          Only used when mode is Delete.
          Cap how many rewatch sessions to remove this run (safety valve).
          Use 0 for no cap (delete every listed rewatch session).
          Example: 10 = stop after 10 successful/attempted removals.
        required: false
        default: "0"
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests

      - name: Run cleanup script
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Map friendly labels → script --type values
          case "${{ inputs.media_type }}" in
            "all — anime + TV shows + movies (recommended)"|"all")
              TYPE="all" ;;
            "anime only"|"anime")
              TYPE="anime" ;;
            "TV shows only"|"shows")
              TYPE="shows" ;;
            "movies only"|"movies")
              TYPE="movies" ;;
            *)
              echo "Unknown media_type label: ${{ inputs.media_type }}"
              exit 1 ;;
          esac

          EXTRA=""
          MODE_LABEL="${{ inputs.mode }}"
          case "$MODE_LABEL" in
            "Delete rewatch sessions (writes to SIMKL)"|true|delete|execute)
              LIMIT="${{ inputs.max_deletes }}"
              LIMIT="${LIMIT:-0}"
              EXTRA="--execute --limit ${LIMIT}"
              echo "Mode: DELETE (limit=${LIMIT})"
              ;;
            *)
              echo "Mode: LIST ONLY (dry-run — no SIMKL writes)"
              ;;
          esac

          echo "Scanning media type: ${TYPE}"
          python scripts/simkl_rewatch_cleanup.py \
            --type "${TYPE}" \
            --json-out simkl_rewatches.json \
            --csv-out simkl_rewatches.csv \
            $EXTRA

      - name: Easy summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# SIMKL rewatch cleanup"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Library | ${{ inputs.media_type }} |"
            echo "| Mode | ${{ inputs.mode }} |"
            echo "| Max deletes | ${{ inputs.max_deletes }} |"
            echo ""
          } > run_summary.md
          python3 scripts/render_run_summary.py --title "SIMKL rewatch cleanup" >> run_summary.md || true
          cat run_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simkl-rewatch-report
          path: |
            simkl_rewatches.json
            simkl_rewatches.csv
            run_summary.md
          if-no-files-found: warn
