name: SIMKL rewatch cleanup

on:
  workflow_dispatch:
    inputs:
      media_type:
        description: anime | shows | movies | all (runs all three in one job)
        required: true
        default: all
        type: choice
        options: [all, anime, shows, movies]
      execute:
        description: Attempt API removal (false = inventory only)
        required: true
        default: false
        type: boolean
      limit:
        description: Max sessions to remove when execute=true (0 = all)
        required: false
        default: "0"
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Run cleanup script
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ inputs.execute }}" = "true" ]; then
            EXTRA="--execute --limit ${{ inputs.limit }}"
          fi
          python scripts/simkl_rewatch_cleanup.py \
            --type "${{ inputs.media_type }}" \
            --json-out simkl_rewatches.json \
            --csv-out simkl_rewatches.csv \
            $EXTRA
      - name: Job summary
        if: always()
        run: |
          {
            echo "# SIMKL rewatch cleanup"
            echo ""
            echo "- Media type: **${{ inputs.media_type }}**"
            echo "- Execute: **${{ inputs.execute }}**"
            echo "- Limit: **${{ inputs.limit }}**"
            echo ""
            if [ -f simkl_rewatches.csv ]; then
              ROWS=$(($(wc -l < simkl_rewatches.csv) - 1))
              echo "## Show report (rewatch sessions)"
              echo ""
              echo "Session rows: **${ROWS}**"
              echo ""
              echo "| simkl | title | rewatch_id | rewatch_status | session_last_watched |"
              echo "|-------|-------|------------|----------------|----------------------|"
              # CSV columns from script: simkl,title,mal,anilist,canonical_status,canonical_last_watched_at,rewatch_id,rewatch_status,session_last_watched_at,session_progress
              tail -n +2 simkl_rewatches.csv | head -n 60 | while IFS= read -r line; do
                simkl=$(echo "$line" | cut -d',' -f1)
                title=$(echo "$line" | cut -d',' -f2 | tr '|' '/')
                rid=$(echo "$line" | cut -d',' -f7)
                rst=$(echo "$line" | cut -d',' -f8)
                slw=$(echo "$line" | cut -d',' -f9)
                echo "| $simkl | ${title:0:40} | $rid | $rst | $slw |"
              done
              if [ "$ROWS" -gt 60 ]; then
                echo ""
                echo "_…and $((ROWS - 60)) more in artifact CSV._"
              fi
            else
              echo "_No simkl_rewatches.csv produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkl-rewatch-report
          path: |
            simkl_rewatches.json
            simkl_rewatches.csv
          if-no-files-found: warn
