name: Universal Anime Sync

on:
  schedule:
    # Runs every 2 hours - adjust as needed
    # GitHub cron is UTC
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      enrich_all:
        description: 'Force re-enrich all IDs via AniZip (slow)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      no_enrich:
        description: 'Skip AniZip enrichment (fastest)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Prevent overlapping runs that could corrupt DB
concurrency:
  group: anime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit sync_db.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use PAT or default GITHUB_TOKEN, fetch full history for commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests

      - name: Restore DB if exists (from repo)
        run: |
          ls -lh sync_db.json id_cache.json 2>&1 || echo "No existing DB - first run will create baseline"

      - name: Run Universal Sync
        env:
          # Required
          ANILIST_USERNAME: ${{ secrets.ANILIST_USERNAME }}
          KITSU_USERNAME: ${{ secrets.KITSU_USERNAME }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          
          # Optional - add when you have them
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          MAL_ACCESS_TOKEN: ${{ secrets.MAL_ACCESS_TOKEN }}
          MAL_USERNAME: ${{ secrets.MAL_USERNAME }}
          
          # For rate limit safety
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ inputs.enrich_all }}" = "true" ]; then
            echo "Force enriching all IDs via AniZip..."
            python universal_anime_sync_github.py --once --enrich-all
          elif [ "${{ inputs.no_enrich }}" = "true" ]; then
            echo "Skipping enrichment (fast mode)..."
            python universal_anime_sync_github.py --once --no-enrich
          else
            echo "Normal run with smart caching..."
            python universal_anime_sync_github.py --once
          fi

      - name: Show summary
        run: |
          echo "=== DB Stats ==="
          cat sync_db.json | python -c "import json,sys; db=json.load(sys.stdin); print(f\"Unique shows: {len(db.get('entries',{}))}\"); entries=db.get('entries',{}).values(); print(f\"With MAL: {sum(1 for e in entries if e.get('ids',{}).get('mal'))}\"); print(f\"With AniDB: {sum(1 for e in entries if e.get('ids',{}).get('anidb'))}\"); print(f\"With IMDB: {sum(1 for e in entries if e.get('ids',{}).get('imdb'))}\")"
          echo ""
          echo "=== ID Cache Stats ==="
          wc -l id_cache.json || echo "No cache yet"
          ls -lh *.json

      - name: Commit DB and ID cache back to repo
        run: |
          git config user.name "anime-sync-bot"
          git config user.email "anime-sync-bot@github.com"
          
          # Pull latest to avoid conflict if another run pushed
          git pull --rebase --autostash || true
          
          git add sync_db.json id_cache.json || true
          
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            echo "Committing updated DB..."
            git commit -m "chore: update sync DB $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi

      - name: Upload DB as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: sync-databases
          path: |
            sync_db.json
            id_cache.json
          retention-days: 30
