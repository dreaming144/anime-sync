name: Universal Anime Sync V3.7

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      enrich_all:
        description: 'Force re-enrich all IDs'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      export_only:
        description: 'Only export CSVs, no fetch'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

concurrency:
  group: anime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Check existing files
        run: |
          echo "=== Existing files ==="
          ls -lh sync.db sync_db.json id_cache.json manual_overrides.json anime_pairings.csv unmatched.csv 2>&1 || true
          echo ""
          echo "=== Overrides ==="
          cat manual_overrides.json || echo "No overrides yet"

      - name: Run Sync
        env:
          ANILIST_USERNAME: ${{ secrets.ANILIST_USERNAME }}
          KITSU_USERNAME: ${{ secrets.KITSU_USERNAME }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          KITSU_TOKEN: ${{ secrets.KITSU_TOKEN }}
          MAL_ACCESS_TOKEN: ${{ secrets.MAL_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.export_only }}" = "true" ]; then
            python universal_anime_sync_github.py --export-only
          elif [ "${{ inputs.enrich_all }}" = "true" ]; then
            python universal_anime_sync_github.py --enrich-all --export-csv
          else
            python universal_anime_sync_github.py --export-csv
          fi

      - name: Show reports
        run: |
          echo "=== anime_pairings.csv preview ==="
          head -n 15 anime_pairings.csv || true
          echo ""
          echo "=== unmatched.csv (needs manual fix) ==="
          cat unmatched.csv || echo "No unmatched - all paired!"
          echo ""
          echo "=== Coverage ==="
          python -c "
          import csv, json
          try:
              rows=list(csv.DictReader(open('anime_pairings.csv')))
              print(f'Total shows: {len(rows)}')
              print(f'MAL: {sum(1 for r in rows if r[\"mal_id\"])}')
              print(f'AniDB: {sum(1 for r in rows if r[\"anidb_id\"])}')
              print(f'IMDB: {sum(1 for r in rows if r[\"imdb_id\"])}')
              print(f'Manual overrides: {sum(1 for r in rows if r[\"source\"]==\"manual_override\")}')
          except Exception as e:
              print(e)
          try:
              u=list(csv.DictReader(open('unmatched.csv')))
              print(f'Unmatched needing attention: {len(u)}')
          except:
              print('No unmatched file')
          "

      - name: Commit all
        run: |
          git config user.name "anime-sync-bot"
          git config user.email "anime-sync-bot@github.com"
          git pull --rebase --autostash || true
          
          # Ensure overrides file exists
          [ -f manual_overrides.json ] || echo '{}' > manual_overrides.json
          
          git add sync.db sync_db.json id_cache.json anime_pairings.csv unmatched.csv manual_overrides.json || true
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sync-reports
          path: |
            sync.db
            sync_db.json
            id_cache.json
            anime_pairings.csv
            unmatched.csv
            manual_overrides.json
            manual_overrides_template.json
          retention-days: 30
