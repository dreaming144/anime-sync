name: Universal Anime Sync V3.13

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: >
          What this run should do.
          "Normal sync" = fetch lists, merge, push changes (usual run).
          "Preview only" = same plan, but do NOT write to AniList/MAL/Kitsu/SIMKL.
          "Fetch only" = update local DB/CSV, never push remote lists.
          "Export CSVs only" = no API fetch; just rebuild pairings/unmatched from DB.
          "Re-enrich all IDs" = clear ID cache and re-resolve every title (slow).
        required: true
        default: Normal sync (fetch + merge + push)
        type: choice
        options:
          - Normal sync (fetch + merge + push)
          - Preview only (no remote list writes)
          - Fetch only (update local DB, skip pushes)
          - Export CSVs only (no fetch)
          - Re-enrich all IDs (slow full refresh)
      override_title:
        description: >
          Optional one-shot manual ID fix.
          Title (or key) to add/update in manual_overrides.json.
          Leave blank for a normal run.
        required: false
        default: ''
        type: string
      override_mal:
        description: Optional MAL numeric id for the override title above
        required: false
        default: ''
        type: string
      override_anilist:
        description: Optional AniList numeric id for the override title above
        required: false
        default: ''
        type: string
      override_simkl:
        description: Optional SIMKL numeric id for the override title above
        required: false
        default: ''
        type: string
      override_scope:
        description: >
          When an override title/id is filled in:
          "Apply override then full sync" continues with the chosen run mode.
          "Apply override only" writes manual_overrides.json and exits (no sync).
        required: true
        default: Apply override then full sync
        type: choice
        options:
          - Apply override then full sync
          - Apply override only (no sync)

concurrency:
  group: anime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Offline dumps (Fribb + Manami). Stable key — do not version per run_id.
      # Python still refreshes files if >7 days old on disk.
      - name: Restore offline mapping caches
        id: cache-offline
        uses: actions/cache/restore@v4
        with:
          path: |
            anime-list-mini.json
            anime-offline-database-minified.json
          key: anime-sync-offline-v3
          restore-keys: |
            anime-sync-offline-v3
            anime-sync-offline-v2
            anime-sync-offline-
            anime-sync-fribb-

      # State cache is fallback only when git does not already have sync.db
      # (git is source of truth; avoids overwriting a newer committed DB)
      - name: Restore state cache (fallback)
        id: cache-state
        if: hashFiles('sync.db') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            sync.db
            id_cache.json
            circuit_state.json
            rate_limit_state.json
          key: anime-sync-state-${{ github.run_id }}
          restore-keys: |
            anime-sync-state-

      - name: Install dependencies
        run: |
          pip install requests
          # gh CLI used to persist rotated MAL refresh tokens into Actions secrets
          (command -v gh >/dev/null) || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          }
          gh --version || true


      - name: Check existing files
        run: |
          echo "=== Existing files ==="
          ls -lh sync.db sync_db.json id_cache.json anime-list-mini.json anime-offline-database-minified.json manual_overrides.json anime_pairings.csv unmatched.csv 2>&1 || true
          echo ""
          echo "=== Cache status ==="
          echo "Offline cache-hit: ${{ steps.cache-offline.outputs.cache-hit }}"
          echo "State cache-hit: ${{ steps.cache-state.outputs.cache-hit }}"
          echo ""
          echo "=== Overrides ==="
          cat manual_overrides.json || echo "No overrides yet"

      - name: Run Sync
        env:
          ANILIST_USERNAME: ${{ secrets.ANILIST_USERNAME }}
          KITSU_USERNAME: ${{ secrets.KITSU_USERNAME }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          KITSU_TOKEN: ${{ secrets.KITSU_TOKEN }}
          KITSU_EMAIL: ${{ secrets.KITSU_EMAIL }}
          KITSU_PASSWORD: ${{ secrets.KITSU_PASSWORD }}
          MAL_ACCESS_TOKEN: ${{ secrets.MAL_ACCESS_TOKEN }}
          MAL_REFRESH_TOKEN: ${{ secrets.MAL_REFRESH_TOKEN }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          SECRETS_WRITE_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXTRA=""
          MODE="${{ inputs.run_mode }}"
          echo "Run mode: $MODE"

          case "$MODE" in
            "Preview only (no remote list writes)")
              EXTRA="$EXTRA --dry-run"
              ;;
            "Fetch only (update local DB, skip pushes)")
              EXTRA="$EXTRA --no-push"
              ;;
          esac

          # One-shot manual override from workflow_dispatch
          if [ -n "${{ inputs.override_title }}" ]; then
            EXTRA="$EXTRA --override-title $(printf %q "${{ inputs.override_title }}")"
          fi
          if [ -n "${{ inputs.override_mal }}" ]; then
            EXTRA="$EXTRA --override-mal ${{ inputs.override_mal }}"
          fi
          if [ -n "${{ inputs.override_anilist }}" ]; then
            EXTRA="$EXTRA --override-anilist ${{ inputs.override_anilist }}"
          fi
          if [ -n "${{ inputs.override_simkl }}" ]; then
            EXTRA="$EXTRA --override-simkl ${{ inputs.override_simkl }}"
          fi

          if [ "${{ inputs.override_scope }}" = "Apply override only (no sync)" ]; then
            if [ -z "${{ inputs.override_title }}${{ inputs.override_mal }}${{ inputs.override_anilist }}${{ inputs.override_simkl }}" ]; then
              echo "Override-only selected but no title/ids provided."
              exit 1
            fi
            python -m anime_sync --override-only --no-json-backup $EXTRA
            exit 0
          fi

          # JSON backup is large; keep SQLite in git, JSON as artifact only
          case "$MODE" in
            "Export CSVs only (no fetch)")
              python -m anime_sync --export-only --no-json-backup $EXTRA
              ;;
            "Re-enrich all IDs (slow full refresh)")
              python -m anime_sync --enrich-all --export-csv --no-json-backup $EXTRA
              ;;
            *)
              python -m anime_sync --export-csv --no-json-backup $EXTRA
              ;;
          esac

      - name: Easy summary
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/render_run_summary.py \
            --title "Universal Anime Sync" \
            --out run_summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Full files: show_report.md, job_summary.md, push_report.csv, conflict_report.csv (artifacts)"

      - name: Commit all
        run: |
          git config user.name "anime-sync-bot"
          git config user.email "anime-sync-bot@github.com"
          git pull --rebase --autostash || true

          [ -f manual_overrides.json ] || echo '{}' > manual_overrides.json

          # Git is source of truth for the DB
          git add -f sync.db id_cache.json circuit_state.json rate_limit_state.json 2>/dev/null || true
          # JSON backup optional — skip if unchanged noise is high; still track when present
          # sync_db.json is artifact-only (avoid repo bloat)
          git add anime_pairings.csv unmatched.csv manual_overrides.json || true

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi

      # Always save post-run state (versioned key so exact-hit never blocks updates)
      - name: Save state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            sync.db
            id_cache.json
            circuit_state.json
          key: anime-sync-state-${{ github.run_id }}

      # Only save offline dumps when restore missed (stable key cannot be overwritten)
      - name: Save offline mapping caches
        if: success() && steps.cache-offline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            anime-list-mini.json
            anime-offline-database-minified.json
          key: anime-sync-offline-v3

      - uses: actions/upload-artifact@v7
        with:
          name: sync-reports
          path: |
            sync.db
            sync_db.json
            id_cache.json
            anime_pairings.csv
            unmatched.csv
            manual_overrides.json
            manual_overrides_template.json
            circuit_metrics.json
            circuit_state.json
            push_report.csv
            job_summary.md
            show_report.md
            watch_history_stats.md
            watch_history_stats.json
          retention-days: 30
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Universal Anime Sync failed. Check logs, circuit_metrics.json, and secrets."
          {
            echo "## Sync failed"
            echo ""
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Branch: `${{ github.ref_name }}`"
            echo "- Actor: ${{ github.actor }}"
            echo ""
            if [ -f show_report.md ]; then cat show_report.md; echo ""; fi
            if [ -f job_summary.md ]; then cat job_summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY" || true
          # Create a GitHub issue when SYNC_FAIL_OPEN_ISSUE=true (optional secret flag via vars)
          if [ "${{ vars.SYNC_FAIL_OPEN_ISSUE }}" = "true" ]; then
            gh issue create               --title "Anime sync failed (${{ github.run_id }})"               --body "Workflow run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"               || true
          fi
